<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2933">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>チラシ配り管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --text:#1f2933; --muted:#7b8794; --border:#e4e7eb;
    --accent:#3b82f6; --field-bg:#fff;
    --shadow:0 2px 10px rgba(0,0,0,.12); --shadow-lg:0 -6px 28px rgba(0,0,0,.18);
    --todo:#94a3b8; --done:#16a34a; --later:#2563eb; --ng:#dc2626;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Segoe UI","Hiragino Sans","Meiryo",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
    overflow:hidden; overscroll-behavior:none;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}

  /* ---------- 地図 ---------- */
  #map{position:fixed; inset:0; background:#e8eaed}
  .leaflet-container{font-family:inherit; background:#e8eaed}
  body.adding #map{cursor:crosshair}

  /* ---------- ピン ---------- */
  .pin{
    width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    border:2.5px solid #fff; box-shadow:0 2px 5px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;
  }
  .pin span{transform:rotate(45deg);color:#fff;font-size:14px;font-weight:700;line-height:1}
  .pin.sel{outline:3px solid #fbbf24;outline-offset:2px}
  .store{
    width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid #dc2626;
    display:flex;align-items:center;justify-content:center;font-size:15px;
    box-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .arealabel{
    transform:translate(-50%,-50%);white-space:nowrap;
    font-size:11px;font-weight:700;color:#5b21b6;
    text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;
    pointer-events:none;
  }
  .me-dot{
    width:18px;height:18px;border-radius:50%;background:#1a73e8;
    border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.35);
  }

  /* ---------- 上部バー ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:600;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;
    background:linear-gradient(#f4f5f7f2,#f4f5f7d9 70%,#f4f5f700);
    pointer-events:none;
  }
  .topbar > *{pointer-events:auto}
  .titlerow{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .titlerow h1{font-size:15px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .titlerow .grow{flex:1}
  .iconbtn{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    font-size:16px;box-shadow:var(--shadow);flex:none;
  }
  .iconbtn:active{background:#eceff3}

  .chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    display:flex;align-items:center;gap:5px;flex:none;
    background:var(--card);border:1px solid var(--border);border-radius:999px;
    padding:5px 11px;font-size:12px;font-weight:600;box-shadow:var(--shadow);
    transition:opacity .15s;
  }
  .chip.off{opacity:.38}
  .chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .chip .n{font-variant-numeric:tabular-nums}
  .bar{
    margin-top:6px;height:6px;border-radius:999px;background:#dfe3e8;overflow:hidden;
    box-shadow:var(--shadow);
  }
  .bar > i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}

  /* ---------- 追加モードのバー ---------- */
  .addbar{
    position:fixed;left:8px;right:8px;z-index:640;
    bottom:calc(var(--safe-b) + 84px);
    background:#1f2933;color:#fff;border-radius:14px;padding:9px 10px;
    box-shadow:var(--shadow-lg);display:none;align-items:center;gap:8px;
  }
  body.adding .addbar{display:flex}
  .addbar .lead{font-size:12px;font-weight:700;flex:1;line-height:1.35}
  .addbar .lead em{font-style:normal;opacity:.7;font-weight:600;display:block;font-size:11px}
  .addbar select{
    background:#2f3b49;border:1px solid #435063;border-radius:9px;padding:6px 8px;
    font-size:12px;font-weight:700;color:#fff;
  }
  .addbar .undo{
    background:#3a4756;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:700;color:#fff;
  }
  .addbar .undo:disabled{opacity:.35}

  /* ---------- 右下ボタン ---------- */
  .fabs{
    position:fixed;right:12px;bottom:calc(var(--safe-b) + 16px);z-index:620;
    display:flex;flex-direction:column;gap:10px;align-items:flex-end;
  }
  .fab{
    background:var(--card);border-radius:50%;width:48px;height:48px;
    box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:20px;
    border:1px solid var(--border);
  }
  .fab.primary{
    width:58px;height:58px;background:var(--accent);color:#fff;border-color:transparent;font-size:15px;
    font-weight:700;flex-direction:column;gap:1px;line-height:1;
  }
  .fab.primary b{font-size:22px;font-weight:700}
  .fab.primary.on{background:#1f2933}
  .fab.locating{color:var(--accent)}

  /* ---------- ボトムシート ---------- */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:700;
    background:var(--card);border-radius:18px 18px 0 0;box-shadow:var(--shadow-lg);
    padding:10px 14px calc(var(--safe-b) + 16px);
    transform:translateY(110%);transition:transform .22s ease;
    max-height:86vh;overflow-y:auto;
  }
  .sheet.open{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:999px;background:#d3d8de;margin:2px auto 10px}
  .sheet h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:10px}
  .sheet h2 .grow{flex:1}
  .sheet .close{font-size:13px;font-weight:700;color:var(--muted);padding:4px 8px}
  .field{margin-bottom:11px}
  .field > label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
  .field input[type=text],.field textarea,.field select{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:10px;
    background:var(--field-bg);outline:none;font-size:15px;
  }
  .field textarea{resize:vertical;min-height:64px;font-size:14px}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
  .statusgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .sbtn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    border:2px solid var(--border);border-radius:11px;padding:11px 6px;
    font-size:13.5px;font-weight:700;background:var(--card);
  }
  .sbtn .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .sbtn.on{border-color:currentColor;background:#f6f8fa}
  .meta{font-size:11.5px;color:var(--muted);margin:8px 0 12px;line-height:1.6}
  .rowbtns{display:flex;gap:8px}
  .btn{
    flex:1;border-radius:11px;padding:11px;font-size:14px;font-weight:700;
    background:var(--accent);color:#fff;text-align:center;
  }
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
  .btn.danger{background:transparent;color:var(--ng);border:1px solid #f3c2c2;flex:none;padding:11px 14px}

  /* ---------- 一覧 ---------- */
  .areastat{margin-bottom:10px;border:1px solid var(--border);border-radius:11px;overflow:hidden}
  .arearow{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px;
  }
  .arearow:last-child{border-bottom:none}
  .arearow.on{background:#eef2ff}
  .arearow .an{flex:none;width:8.5em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arearow .ab{flex:1;height:6px;border-radius:999px;background:#dfe3e8;overflow:hidden}
  .arearow .ab i{display:block;height:100%;background:var(--done)}
  .arearow .ac{flex:none;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
  .listrow{
    display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--border);
    text-align:left;width:100%;
  }
  .listrow:last-child{border-bottom:none}
  .listrow .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .listrow .txt{flex:1;min-width:0}
  .listrow .t1{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .listrow .t2{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .listrow .go{font-size:11px;color:var(--accent);font-weight:700;flex:none}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px}

  /* ---------- 場所の吹き出し ---------- */
  .leaflet-popup-content{margin:10px 12px;font-size:13px}
  .leaflet-popup-content-wrapper{border-radius:13px}
  .pl-area{font-size:13px;font-weight:700;margin-bottom:2px}
  .pl-cap{font-size:10.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .pl-list{max-height:180px;overflow-y:auto;margin:0 -4px 8px}
  .pl-row{
    display:block;width:100%;text-align:left;padding:6px 6px;border-radius:8px;
    border-bottom:1px solid var(--border);
  }
  .pl-row:last-child{border-bottom:none}
  .pl-row:active{background:#eef2ff}
  .pl-name{display:block;font-size:13px;font-weight:600;line-height:1.35}
  .pl-sub{display:block;font-size:10.5px;color:var(--muted)}
  .pl-none{font-size:12px;color:var(--muted);padding:4px 2px 8px}
  .pl-add{
    display:block;width:100%;background:var(--accent);color:#fff;
    border-radius:9px;padding:8px;font-size:13px;font-weight:700;text-align:center;
  }

  /* ---------- モーダル ---------- */
  .modal{
    position:fixed;inset:0;z-index:900;background:rgba(15,20,25,.55);
    display:none;align-items:center;justify-content:center;padding:18px;
  }
  .modal.open{display:flex}
  .modal .box{
    background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:380px;
    box-shadow:var(--shadow-lg);max-height:88vh;overflow-y:auto;
  }
  .modal h3{font-size:16px;font-weight:700;margin-bottom:6px}
  .modal p{font-size:12.5px;color:var(--muted);margin-bottom:13px;line-height:1.6}
  .modal hr{border:none;border-top:1px solid var(--border);margin:15px 0}

  /* ---------- 位置決めモード ---------- */
  .crosshair{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:610;
    pointer-events:none;display:none;
  }
  body.picking .crosshair{display:block}
  .crosshair .ring{position:relative;width:46px;height:46px;border:3px solid #dc2626;border-radius:50%;
    box-shadow:0 0 0 2px #fff,0 2px 8px rgba(0,0,0,.35)}
  .crosshair .ring::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;
    margin:-3px 0 0 -3px;background:#dc2626;border-radius:50%}
  .pickbar{
    position:fixed;left:10px;right:10px;bottom:calc(var(--safe-b) + 16px);z-index:660;
    background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow-lg);display:none;
  }
  body.picking .pickbar{display:block}
  body.picking .fabs,body.picking .addbar{display:none !important}
  .pickbar .t{font-size:13px;font-weight:700;margin-bottom:9px;text-align:center}

  /* ---------- トースト・同期状態 ---------- */
  .toast{
    position:fixed;left:50%;transform:translateX(-50%) translateY(-14px);
    top:calc(env(safe-area-inset-top,0px) + 92px);z-index:950;
    background:#1f2933;color:#fff;border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:600;
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .syncdot{
    font-size:10.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:4px;
    background:var(--card);border:1px solid var(--border);border-radius:999px;padding:5px 9px;
    box-shadow:var(--shadow);white-space:nowrap;
  }
  .syncdot i{width:7px;height:7px;border-radius:50%;background:var(--done);display:block}
  .syncdot.warn i{background:#f59e0b}
  .syncdot.bad i{background:var(--ng)}
  .leaflet-control-attribution{font-size:9px}
  .leaflet-bottom.leaflet-right{margin-bottom:calc(var(--safe-b) + 78px)}
  .leaflet-bottom.leaflet-left{margin-bottom:calc(var(--safe-b) + 78px)}
  body.picking .leaflet-bottom,body.adding .leaflet-bottom.leaflet-left{display:none}
</style>
</head>
<body>

<div id="map"></div>

<div class="crosshair"><div class="ring"></div></div>

<!-- ===== 上部：タイトル・進捗 ===== -->
<div class="topbar">
  <div class="titlerow">
    <h1>📍 チラシ配り</h1>
    <div class="syncdot" id="syncDot"><i></i><span id="syncTxt">接続中</span></div>
    <div class="grow"></div>
    <button type="button" class="iconbtn" id="btnList" title="一覧">☰</button>
    <button type="button" class="iconbtn" id="btnSettings" title="設定">⚙</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="bar"><i id="barFill"></i></div>
</div>

<!-- ===== 追加モードのバー ===== -->
<div class="addbar">
  <div class="lead">
    建物をタップでピン追加
    <em id="addHint">長押しでメモ付き追加</em>
  </div>
  <select id="addStatus"></select>
  <button type="button" class="undo" id="btnUndo" disabled>取消</button>
</div>

<!-- ===== 右下ボタン ===== -->
<div class="fabs">
  <button type="button" class="fab" id="btnLocate" title="現在地">◎</button>
  <button type="button" class="fab primary" id="btnAdd"><b>＋</b>ピン</button>
</div>

<!-- ===== お店の位置を決めるバー ===== -->
<div class="pickbar">
  <div class="t" id="pickTitle">地図を動かして お店の位置 を中心に合わせてください</div>
  <div class="rowbtns">
    <button type="button" class="btn ghost" id="pickCancel">やめる</button>
    <button type="button" class="btn" id="pickOk">ここに決定</button>
  </div>
</div>

<!-- ===== ピン編集シート ===== -->
<div class="sheet" id="pinSheet">
  <div class="grab"></div>
  <h2><span id="pinTitle">ピン</span><span class="grow"></span>
    <button type="button" class="close" id="pinClose">閉じる</button></h2>

  <div class="field">
    <label>状況</label>
    <div class="statusgrid" id="pinStatus"></div>
  </div>
  <div class="field">
    <label>建物名・部屋番号など（任意）</label>
    <input type="text" id="pinLabel" placeholder="例）〇〇ハイツ 101〜305">
  </div>
  <div class="field">
    <label>メモ（任意）</label>
    <textarea id="pinNote" placeholder="例）管理人さんに許可もらった／ポスト共用部のみ"></textarea>
  </div>
  <div class="meta" id="pinMeta"></div>
  <div class="rowbtns">
    <button type="button" class="btn danger" id="pinDelete">削除</button>
    <button type="button" class="btn" id="pinSave">保存して閉じる</button>
  </div>
</div>

<!-- ===== 一覧シート ===== -->
<div class="sheet" id="listSheet">
  <div class="grab"></div>
  <h2><span id="listTitle">ピン一覧</span><span class="grow"></span>
    <button type="button" class="close" id="listClose">閉じる</button></h2>
  <div class="field">
    <select id="listFilter"></select>
  </div>
  <div id="listBody"></div>
</div>

<!-- ===== 名前入力 ===== -->
<div class="modal" id="nameModal">
  <div class="box">
    <h3>お名前を入れてください</h3>
    <p>誰がどの建物を回ったか分かるようにするためだけに使います。ログインはありません。</p>
    <div class="field"><input type="text" id="nameInput" placeholder="例）田中" maxlength="12"></div>
    <button type="button" class="btn" id="nameOk">はじめる</button>
  </div>
</div>

<!-- ===== 設定 ===== -->
<div class="modal" id="setModal">
  <div class="box">
    <h3>設定</h3>
    <div class="field">
      <label>自分の名前</label>
      <input type="text" id="setName" maxlength="12">
    </div>
    <div class="field">
      <label>地図の種類</label>
      <select id="setTiles"></select>
    </div>
    <hr>
    <div class="field">
      <label>お店の位置（地図の中心）</label>
      <div class="rowbtns">
        <button type="button" class="btn ghost" id="setUseGps">現在地にする</button>
        <button type="button" class="btn ghost" id="setPick">地図で選ぶ</button>
      </div>
    </div>
    <p id="setCenterInfo"></p>
    <hr>
    <div class="field">
      <label>配る範囲の決め方</label>
      <select id="setAreaMode">
        <option value="areas">決めた町丁目のぜんぶ</option>
        <option value="circle">お店からの距離で決める</option>
      </select>
    </div>
    <div class="field" id="setRadiusField">
      <label>お店からの距離</label>
      <select id="setRadius">
        <option value="400">徒歩5分くらい（半径400m）</option>
        <option value="800">徒歩10分くらい（半径800m）</option>
        <option value="1200">徒歩15分くらい（半径1.2km）</option>
        <option value="2000">広め（半径2km）</option>
      </select>
    </div>
    <div class="field">
      <label><input type="checkbox" id="setShowAreas" style="width:auto;margin-right:7px;vertical-align:-2px">町丁目の区域を地図に表示する</label>
      <p id="setAreaInfo" style="margin:5px 0 0"></p>
    </div>
    <hr>
    <div class="field">
      <label>次のラウンドを始める</label>
      <button type="button" class="btn ghost" id="setReset">すべてのピンを「未訪問」に戻す</button>
    </div>
    <div class="rowbtns">
      <a class="btn ghost" href="./index.html" style="text-decoration:none;line-height:1.5">📋 タスク管理へ</a>
      <button type="button" class="btn" id="setClose">閉じる</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   チラシ配り進捗管理
   地図: OpenStreetMap + Leaflet / 保存: Supabase（無料枠）
   ============================================================ */

const SUPABASE_URL = 'https://xldkfkhgazpugfuscpqt.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsZGtma2hnYXpwdWdmdXNjcHF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4NDg3MzgsImV4cCI6MjA5OTQyNDczOH0.C3_TYQI8R3HeXYWTzca9erUMjpTWm2sneB7hk5Bre8Y';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- ステータス定義 ---------- */
const STATUS = {
  todo : { label:'未訪問',   short:'未訪問',   color:'#94a3b8', icon:'･' },
  done : { label:'配布済み', short:'配布済み', color:'#16a34a', icon:'✓' },
  later: { label:'要再訪',   short:'要再訪',   color:'#2563eb', icon:'↻' },
  ng   : { label:'配布不可', short:'配布不可', color:'#dc2626', icon:'×' },
};
const STATUS_KEYS = ['done','todo','later','ng'];

/* ---------- 地図タイル ---------- */
const TILES = {
  osm: {
    name:'標準地図（お店の名前が多い）',
    url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    opts:{ maxZoom:19, attribution:'&copy; OpenStreetMap contributors' },
  },

// 区域全体を囲む四角。地図の初期表示と、動かせる範囲の計算に使う
const AREA_BOUNDS = (() => {
  let s = 90, w = 180, n = -90, e = -180;
  AREAS.features.forEach((f) => f.geometry.coordinates[0].forEach(([x, y]) => {
    if (y < s) s = y; if (y > n) n = y; if (x < w) w = x; if (x > e) e = x;
  }));
  return L.latLngBounds([s, w], [n, e]);
})();

// 点が多角形の中にあるか（交差数判定）。町丁目の割り出しに使う
function inRing(lat, lng, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}

// その座標がどの町丁目か。どの区域にも入っていなければ空文字
function areaOf(lat, lng) {
  for (const f of AREAS.features) {
    if (inRing(lat, lng, f.geometry.coordinates[0])) return f.properties.name;
  }
  return '';
}

const AREA_NAMES = AREAS.features.map((f) => f.properties.name);

// タップした場所から半径 radius メートル以内のお店を、近い順に返す
function nearbyPlaces(lat, lng, radius, limit) {
  radius = radius || 60; limit = limit || 8;
  const dLat = radius / 111320;
  const dLng = radius / (111320 * Math.cos(lat * Math.PI / 180));
  const out = [];
  for (let i = 0; i < POIS.length; i++) {
    const q = POIS[i];
    if (Math.abs(q[2] - lat) > dLat || Math.abs(q[3] - lng) > dLng) continue;
    const d = map.distance([lat, lng], [q[2], q[3]]);
    if (d <= radius) out.push({ name:q[0], kind:q[1], lat:q[2], lng:q[3], d:Math.round(d) });
  }
  out.sort((a, b) => a.d - b.d);
  return out.slice(0, limit);
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2000);
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  return sameDay ? ('今日 ' + hm) : ((d.getMonth()+1) + '/' + d.getDate() + ' ' + hm);
}

function applyTiles(key) {
  tileKey = TILES[key] ? key : 'osm';
  lsSet(LS.tiles, tileKey);
  if (tileLayer) map.removeLayer(tileLayer);
  const t = TILES[tileKey];
  tileLayer = L.tileLayer(t.url, t.opts).addTo(map);
  if (tileLayer.bringToBack) tileLayer.bringToBack();
}
applyTiles(tileKey);

/* ---------- 配る区域（町丁目）を地図に描く ---------- */
function renderAreas() {
  if (areaLayer) { map.removeLayer(areaLayer); areaLayer = null; }
  if (areaLabels) { map.removeLayer(areaLabels); areaLabels = null; }
  if (settings.showAreas === false) return;

  areaLayer = L.geoJSON(AREAS, {
    style: () => ({
      color:'#7c3aed', weight:2, opacity:.9,
      fillColor:'#7c3aed', fillOpacity:.07, interactive:false,
    }),
  }).addTo(map);
  areaLayer.bringToBack();

  // 区域の名前。近づいたときだけ出す（引いた画面では邪魔になるため）
  areaLabels = L.layerGroup();
  AREAS.features.forEach((f) => {
    const b = L.geoJSON(f).getBounds();
    areaLabels.addLayer(L.marker(b.getCenter(), {
      icon: L.divIcon({ className:'', html:'<div class="arealabel">' + esc(f.properties.name) + '</div>', iconSize:[0,0] }),
      interactive:false, zIndexOffset:-800,
    }));
  });
  updateAreaLabels();
}

function updateAreaLabels() {
  if (!areaLabels) return;
  const show = map.getZoom() >= 16;
  if (show && !map.hasLayer(areaLabels)) areaLabels.addTo(map);
  if (!show && map.hasLayer(areaLabels)) map.removeLayer(areaLabels);
}

/* 対象エリアだけを見せる（範囲外に出られないようにする） */
function applyArea(fly) {
  renderAreas();

  // お店の位置が決まっていれば、家マークと距離の円も出す
  if (areaCircle) { map.removeLayer(areaCircle); areaCircle = null; }
  if (storeMarker) { map.removeLayer(storeMarker); storeMarker = null; }
  if (settings.center) {
    const c = L.latLng(settings.center.lat, settings.center.lng);
    storeMarker = L.marker(c, {
      icon: L.divIcon({ className:'', html:'<div class="store">🏠</div>', iconSize:[30,30], iconAnchor:[15,15] }),
      interactive:false, zIndexOffset:-500,
    }).addTo(map);
    if (settings.areaMode === 'circle') {
      areaCircle = L.circle(c, {
        radius: Number(settings.radius) || 800, color:'#dc2626', weight:2, opacity:.55,
        dashArray:'7 7', fillColor:'#dc2626', fillOpacity:.04, interactive:false,
      }).addTo(map);
    }
  }

  // 動ける範囲。既定は「決めた町丁目の全体」、お店からの距離で決めることもできる
  let bounds = null;
  if (settings.areaMode === 'circle' && settings.center) {
    const c = L.latLng(settings.center.lat, settings.center.lng);
    bounds = c.toBounds((Number(settings.radius) || 800) * 2);
  } else if (AREAS.features.length) {
    bounds = AREA_BOUNDS;
  }
  if (!bounds) { map.setMaxBounds(null); map.setMinZoom(3); return; }

  map.setMaxBounds(bounds.pad(0.35));
  // 引きで見たときに対象エリア全体が入るところまでは縮小できるようにする
  map.setMinZoom(Math.max(11, map.getBoundsZoom(bounds)));
  // 起動直後は、歩きながら使いやすい縮尺で開く
  if (fly) {
    const c = settings.center && L.latLng(settings.center.lat, settings.center.lng);
    // お店が対象エリアの外に登録されていても、地図が飛ばされないようにする
    if (c && bounds.contains(c)) map.setView(c, 17, { animate:false });
    else map.fitBounds(bounds, { animate:false });
  }
}

  const s = STATUS[status] || STATUS.todo;
  return L.divIcon({
    className: '',
    html: '<div class="pin' + (selected ? ' sel' : '') + '" style="background:' + s.color + '">'
        + '<span>' + s.icon + '</span></div>',
    iconSize: [28, 28],
    iconAnchor: [14, 28],
  });
}

function visible(p) { return !p.deleted && filter.has(p.status); }

function renderPins() {
  // 追加・更新
  pins.forEach((p, id) => {
    if (!visible(p)) {
      if (markers.has(id)) { map.removeLayer(markers.get(id)); markers.delete(id); }
      return;
    }
    let m = markers.get(id);
    const icon = pinIcon(p.status, id === selectedId);
    if (!m) {
      m = L.marker([p.lat, p.lng], { icon, keyboard:false });
      m.on('click', (e) => { L.DomEvent.stop(e); openPin(id); });
      m.addTo(map);
      markers.set(id, m);
    } else {
      const ll = m.getLatLng();
      if (ll.lat !== p.lat || ll.lng !== p.lng) m.setLatLng([p.lat, p.lng]);
      m.setIcon(icon);
    }
    m._status = p.status;
  });
  // 消えたもの
  markers.forEach((m, id) => {
    if (!pins.has(id) || !visible(pins.get(id))) { map.removeLayer(m); markers.delete(id); }
  });
  renderProgress();
  if ($('listSheet').classList.contains('open')) renderList();
}

/* ============================================================
   進捗の表示
   ============================================================ */
function counts() {
  const c = { todo:0, done:0, later:0, ng:0, total:0 };
  pins.forEach((p) => { if (!p.deleted) { c[p.status] = (c[p.status] || 0) + 1; c.total++; } });
  return c;
}

function renderProgress() {
  const c = counts();
  const box = $('chips');
  box.innerHTML = STATUS_KEYS.map((k) =>
    '<button type="button" class="chip' + (filter.has(k) ? '' : ' off') + '" data-s="' + k + '">'
    + '<i class="dot" style="background:' + STATUS[k].color + '"></i>'
    + STATUS[k].short + '<b class="n">' + (c[k] || 0) + '</b></button>'
  ).join('') + '<span class="chip" style="box-shadow:none;background:transparent;border-color:transparent">合計 ' + c.total + '</span>';

  box.querySelectorAll('.chip[data-s]').forEach((el) => {
    el.onclick = () => {
      const k = el.dataset.s;
      if (filter.has(k)) filter.delete(k); else filter.add(k);
      if (filter.size === 0) STATUS_KEYS.forEach((x) => filter.add(x)); // 全部消すのは不便なので戻す
      lsSet(LS.filter, [...filter]);
      renderPins();
    };
  });

  const pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
  $('barFill').style.width = pct + '%';
}

/* ============================================================
   保存（オフラインでも消えないようにキューに積む）
   ============================================================ */
function cacheLocal() {
  lsSet(LS.cache, { pins:[...pins.values()], settings });
}

function setSync(state, text) {
  const d = $('syncDot');
  d.className = 'syncdot' + (state === 'ok' ? '' : ' ' + state);
  $('syncTxt').textContent = text;
}

// 町丁目(area)は緯度経度から毎回わり出せるので、サーバには送らない。
// （テーブルにその列は無い。送るとupsertごと失敗して相手に届かなくなる）
function forDb(p) {
  const { area, ...rest } = p;
  return rest;
}

function enqueue(pin) {
  queue = queue.filter((q) => q.id !== pin.id);
  queue.push(pin);
  lsSet(LS.queue, queue);
  setSync('warn', '未送信 ' + queue.length + '件');
}

async function flushQueue() {
  if (!queue.length) return;
  const batch = queue.slice(0, 50);
  const { error } = await db.from('flyer_pins').upsert(batch.map(forDb));
  if (error) { setSync('bad', '未送信 ' + queue.length + '件'); return; }
  const ids = new Set(batch.map((b) => b.id));
  queue = queue.filter((q) => !ids.has(q.id));
  lsSet(LS.queue, queue);
  setSync(queue.length ? 'warn' : 'ok', queue.length ? ('未送信 ' + queue.length + '件') : '同期中');
}

async function savePin(p) {
  p.updated_at = new Date().toISOString();
  p.author = p.author || me;
  pins.set(p.id, p);
  cacheLocal();
  renderPins();
  const { error } = await db.from('flyer_pins').upsert(forDb(p));
  if (error) { enqueue(p); console.warn('保存できませんでした', error); }
  else if (!queue.length) { setSync('ok', '同期中'); }
}

async function saveSettings() {
  cacheLocal();
  const { error } = await db.from('flyer_settings')
    .upsert({ id:'map', data:settings, updated_at:new Date().toISOString() });
  if (error) toast('設定を共有できませんでした（この端末には保存済み）');
}

/* ============================================================
   読み込み・同期
   ============================================================ */
function mergePin(row) {
  if (row && row.area == null) row.area = areaOf(row.lat, row.lng);
  const cur = pins.get(row.id);
  // 同じピンを2人が触ったときは、あとから更新された方を残す
  if (cur && cur.updated_at && row.updated_at && cur.updated_at > row.updated_at) return;
  pins.set(row.id, row);
}

async function loadAll(quiet) {
  try {
    const [pinRes, setRes] = await Promise.all([
      db.from('flyer_pins').select('*'),
      db.from('flyer_settings').select('*').eq('id', 'map').maybeSingle(),
    ]);
    if (pinRes.error) throw pinRes.error;

    // ローカルの未送信ぶんが上書きされないようにマージする
    (pinRes.data || []).forEach(mergePin);
    queue.forEach((q) => pins.set(q.id, q));

    if (setRes && setRes.data && setRes.data.data) {
      const hadCenter = !!(settings.center);
      const before = JSON.stringify(settings);
      settings = Object.assign({ center:null, radius:800, areaMode:'areas', showAreas:true }, setRes.data.data);
      // 12秒ごとの取り直しで地図がちらつかないよう、本当に変わったときだけ描き直す
      if (JSON.stringify(settings) !== before) applyArea(!hadCenter && !!settings.center);
    }
    cacheLocal();
    renderPins();
    setSync(queue.length ? 'warn' : 'ok', queue.length ? ('未送信 ' + queue.length + '件') : '同期中');
  } catch (e) {
    const msg = String((e && (e.message || e.hint)) || '');
    if (/flyer_pins/.test(msg) && /does not exist|not find|schema cache/i.test(msg)) {
      setSync('bad', '準備が必要');
      if (!quiet) alert(['保存用のテーブルがまだありません。','','FLYER_SETUP.md の手順にある SQL を Supabase で1回だけ実行してください。','それまでは、この端末の中だけに記録されます。'].join(String.fromCharCode(10)));
      return;
    }
    setSync('bad', 'オフライン');
    if (!quiet) toast('通信できません。この端末の記録で表示しています');
  }
}

function subscribeRealtime() {
  db.channel('flyer-pins')
    .on('postgres_changes', { event:'*', schema:'public', table:'flyer_pins' }, (payload) => {
      const row = payload.new;
      if (!row || !row.id) return;
      if (queue.some((q) => q.id === row.id)) return; // 自分の未送信ぶんが優先
      mergePin(row);
      cacheLocal();
      renderPins();
      if (selectedId === row.id && !sheetDirty) fillPinSheet(row);
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'flyer_settings' }, () => loadAll(true))
    .subscribe();
}

/* ============================================================
   地図をタップしたとき：その場所のお店の名前と町丁目を出す
   ============================================================ */
let placePopup = null;
let placeList = [];

function placeRows(list) {
  if (!POIS.length) return '<div class="pl-none">お店のデータが入っていません</div>';
  if (!list.length) return '<div class="pl-none">この近くに登録されたお店はありません</div>';
  return list.map((q, i) =>
    '<button type="button" class="pl-row" data-i="' + i + '">'
    + '<span class="pl-name">' + esc(q.name) + '</span>'
    + '<span class="pl-sub">' + (q.kind ? esc(q.kind) + ' ・ ' : '') + q.d + 'm</span>'
    + '</button>').join('');
}

function showPlacePopup(latlng) {
  const area = areaOf(latlng.lat, latlng.lng);
  placeList = nearbyPlaces(latlng.lat, latlng.lng, 60, 8);
  const html =
    '<div class="pl">'
    + '<div class="pl-area">' + (area ? esc(area) : '対象エリアの外') + '</div>'
    + '<div class="pl-cap">この場所のお店（近い順・タップでピン）</div>'
    + '<div class="pl-list">' + placeRows(placeList) + '</div>'
    + '<button type="button" class="pl-add" data-here="1">ここにピンを立てる</button>'
    + '</div>';
  placePopup = L.popup({ maxWidth:270, minWidth:210, autoPanPadding:[16, 100], closeButton:true })
    .setLatLng(latlng).setContent(html).openOn(map);
}

// 吹き出しの中のボタン（開くたびに作り直されるので、まとめて拾う）
document.addEventListener('click', (ev) => {
  const row = ev.target.closest && ev.target.closest('.pl-row');
  const add = ev.target.closest && ev.target.closest('.pl-add');
  if (!row && !add) return;
  const at = placePopup && placePopup.getLatLng();
  map.closePopup();
  if (add) { if (at) addPinAt(at, addMode ? $('addStatus').value : 'todo', true); return; }
  const q = placeList[Number(row.dataset.i)];
  if (!q) return;
  addPinAt(L.latLng(q.lat, q.lng), addMode ? $('addStatus').value : 'todo', true, q.name);
});

/* ============================================================
   ピンの追加・編集
   ============================================================ */
function newPin(lat, lng, status) {
  const now = new Date().toISOString();
  return {
    id: uid(), lat, lng, status: status || 'done', area: areaOf(lat, lng),
    label:'', note:'', author: me, deleted:false, created_at: now, updated_at: now,
  };
}

function addPinAt(latlng, status, openSheet, label) {
  const limit = map.options.maxBounds;
  if (limit && !limit.contains(latlng)) { toast('対象エリアの外です'); return; }
  const p = newPin(
    Math.round(latlng.lat * 1e7) / 1e7,
    Math.round(latlng.lng * 1e7) / 1e7,
    status
  );
  if (label) p.label = label;
  savePin(p);
  lastAddedId = p.id;
  $('btnUndo').disabled = false;
  if (openSheet) openPin(p.id);
  else toast(STATUS[p.status].label + ' を追加');
}

let sheetDirty = false;

function openPin(id) {
  const p = pins.get(id);
  if (!p) return;
  selectedId = id;
  sheetDirty = false;
  closeSheet('listSheet');
  fillPinSheet(p);
  $('pinSheet').classList.add('open');
  renderPins();
}

function fillPinSheet(p) {
  $('pinTitle').textContent = p.label ? p.label : 'ピン';
  $('pinLabel').value = p.label || '';
  $('pinNote').value = p.note || '';
  $('pinStatus').innerHTML = STATUS_KEYS.map((k) =>
    '<button type="button" class="sbtn' + (p.status === k ? ' on' : '') + '" data-s="' + k + '"'
    + ' style="color:' + STATUS[k].color + '">'
    + '<i class="dot" style="background:' + STATUS[k].color + '"></i>'
    + '<span style="color:var(--text)">' + STATUS[k].label + '</span></button>'
  ).join('');
  $('pinStatus').querySelectorAll('.sbtn').forEach((el) => {
    el.onclick = () => {
      const cur = pins.get(selectedId);
      if (!cur) return;
      cur.status = el.dataset.s;
      cur.author = me;
      savePin(cur);
      fillPinSheet(cur);
      toast(STATUS[cur.status].label + ' にしました');
    };
  });
  $('pinMeta').innerHTML =
    (p.area ? '場所：<b>' + esc(p.area) + '</b><br>' : '')
    + '最終更新：' + (esc(p.author) || '(名前なし)') + ' ・ ' + fmtTime(p.updated_at)
    + '<br>作成：' + fmtTime(p.created_at);
}

function collectPinSheet() {
  const p = pins.get(selectedId);
  if (!p) return null;
  const label = $('pinLabel').value.trim();
  const note  = $('pinNote').value.trim();
  if (label !== (p.label || '') || note !== (p.note || '')) {
    p.label = label; p.note = note; p.author = me;
    sheetDirty = false;
    return p;
  }
  sheetDirty = false;
  return null;
}

function closeSheet(which) {
  $(which).classList.remove('open');
  if (which === 'pinSheet') { selectedId = null; renderPins(); }
}

/* ============================================================
   一覧
   ============================================================ */
function renderList() {
  const mode = $('listFilter').value || 'all';
  const alive = [...pins.values()].filter((p) => !p.deleted);
  const rows = alive
    .filter((p) => mode === 'all'
               || (mode.startsWith('area:') ? p.area === mode.slice(5) : p.status === mode))
    .sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at)));

  $('listTitle').textContent = 'ピン一覧（' + rows.length + '件）';
  const body = $('listBody');

  // 町丁目ごとの進捗（配布済み ÷ その町丁目のピン数）
  let head = '';
  const byArea = new Map();
  alive.forEach((p) => {
    const k = p.area || 'その他';
    if (!byArea.has(k)) byArea.set(k, { done:0, total:0 });
    const a = byArea.get(k);
    a.total++; if (p.status === 'done') a.done++;
  });
  if (byArea.size) {
    const order = AREA_NAMES.filter((n) => byArea.has(n)).concat(byArea.has('その他') ? ['その他'] : []);
    head = '<div class="areastat">' + order.map((n) => {
      const a = byArea.get(n);
      const pct = a.total ? Math.round(a.done / a.total * 100) : 0;
      return '<button type="button" class="arearow' + (mode === 'area:' + n ? ' on' : '') + '" data-area="' + esc(n) + '">'
            + '<span class="an">' + esc(n) + '</span>'
            + '<span class="ab"><i style="width:' + pct + '%"></i></span>'
            + '<span class="ac">' + a.done + '/' + a.total + '</span></button>';
    }).join('') + '</div>';
  }

  if (!rows.length) { body.innerHTML = head + '<div class="empty">まだピンがありません</div>'; }
  else {
    body.innerHTML = head + rows.map((p) =>
      '<button type="button" class="listrow" data-id="' + p.id + '">'
      + '<i class="dot" style="background:' + STATUS[p.status].color + '"></i>'
      + '<span class="txt">'
      + '<span class="t1">' + (esc(p.label) || STATUS[p.status].label) + '</span>'
      + '<span class="t2">' + (p.area ? esc(p.area) + ' ・ ' : '') + STATUS[p.status].label
      + ' ・ ' + (esc(p.author) || '?') + ' ・ ' + fmtTime(p.updated_at)
      + (p.note ? ' ・ ' + esc(p.note) : '') + '</span>'
      + '</span><span class="go">地図で見る</span></button>'
    ).join('');
  }

  body.querySelectorAll('.listrow').forEach((el) => {
    el.onclick = () => {
      const p = pins.get(el.dataset.id);
      if (!p) return;
      map.setView([p.lat, p.lng], Math.max(map.getZoom(), 18));
      openPin(p.id);
    };
  });
  body.querySelectorAll('.arearow').forEach((el) => {
    el.onclick = () => {
      const v = 'area:' + el.dataset.area;
      $('listFilter').value = ($('listFilter').value === v) ? 'all' : v;
      renderList();
    };
  });
}

/* ============================================================
   現在位置
   ============================================================ */
function startWatch() {
  if (!navigator.geolocation) { toast('この端末では位置情報が使えません'); return; }
  if (watchId !== null) return;
  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const ll = [pos.coords.latitude, pos.coords.longitude];
      const acc = pos.coords.accuracy || 0;
      if (!meMarker) {
        meMarker = L.marker(ll, {
          icon: L.divIcon({ className:'', html:'<div class="me-dot"></div>', iconSize:[18,18], iconAnchor:[9,9] }),
          interactive:false, zIndexOffset:1000,
        }).addTo(map);
        meCircle = L.circle(ll, { radius:acc, color:'#1a73e8', weight:1, opacity:.4,
          fillColor:'#1a73e8', fillOpacity:.10, interactive:false }).addTo(map);
      } else {
        meMarker.setLatLng(ll);
        meCircle.setLatLng(ll).setRadius(acc);
      }
      $('btnLocate').classList.add('locating');
      if (firstFix) { firstFix = false; if (settings.center) map.setView(ll, 18); }
    },
    (err) => {
      $('btnLocate').classList.remove('locating');
      if (err.code === 1) toast('位置情報が許可されていません（ブラウザの設定から許可してください）');
      else toast('現在地を取得できませんでした');
    },
    { enableHighAccuracy:true, maximumAge:5000, timeout:15000 }
  );
}

/* ============================================================
   お店の位置を決める
   ============================================================ */
function startPick() {
  pickMode = 'store';
  document.body.classList.add('picking');
  closeSheet('pinSheet'); closeSheet('listSheet');
  $('setModal').classList.remove('open');
  map.setMaxBounds(null);
  map.setMinZoom(3);
  if (settings.center) map.setView([settings.center.lat, settings.center.lng], 17);
}

function endPick(commit) {
  if (commit) {
    const c = map.getCenter();
    settings.center = { lat: Math.round(c.lat*1e7)/1e7, lng: Math.round(c.lng*1e7)/1e7 };
    saveSettings();
    toast('お店の位置を決めました');
  }
  pickMode = null;
  document.body.classList.remove('picking');
  applyArea(commit);
  if (!commit && !settings.center) { map.setMaxBounds(null); map.setMinZoom(3); }
  updateSettingsInfo();
}

function longPressAdd(latlng) {

  suppressClickUntil = Date.now() + 700;
  addPinAt(latlng, addMode ? $('addStatus').value : 'todo', true);
}
map.on('contextmenu', (e) => { L.DomEvent.preventDefault(e); longPressAdd(e.latlng); });

// iOS Safari は長押しで contextmenu を出さないため、タッチを自分で見る
(function touchLongPress() {
  const el = map.getContainer();
  let timer = null, sx = 0, sy = 0;
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { cancel(); return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    cancel();
    timer = setTimeout(() => {
      timer = null;
      longPressAdd(map.mouseEventToLatLng({ clientX:sx, clientY:sy }));
    }, 550);
  }, { passive:true });
  el.addEventListener('touchmove', (e) => {
    if (!timer) return;
    const t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) cancel();
  }, { passive:true });
  el.addEventListener('touchend', cancel, { passive:true });
  el.addEventListener('touchcancel', cancel, { passive:true });
})();

$('setAreaMode').onchange = () => {
  settings.areaMode = $('setAreaMode').value;
  if (settings.areaMode === 'circle' && !settings.center) {
    toast('先にお店の位置を決めてください');
    settings.areaMode = 'areas'; $('setAreaMode').value = 'areas';
  }
  updateSettingsInfo();
  saveSettings();
  applyArea(true);
};
$('setShowAreas').onchange = () => {
  settings.showAreas = $('setShowAreas').checked;
  saveSettings();
  applyArea(false);
};
$('setRadius').onchange = () => {
  settings.radius = Number($('setRadius').value);
  saveSettings();
  applyArea(true);
};
$('setPick').onclick = startPick;
$('setUseGps').onclick = () => {
  if (!navigator.geolocation) { toast('この端末では位置情報が使えません'); return; }
  toast('現在地を取得しています…');
  navigator.geolocation.getCurrentPosition((pos) => {
    settings.center = {
      lat: Math.round(pos.coords.latitude * 1e7) / 1e7,
      lng: Math.round(pos.coords.longitude * 1e7) / 1e7,
    };
    saveSettings();
    applyArea(true);
    updateSettingsInfo();
    startWatch();
    toast('現在地をお店の位置にしました');
  }, () => toast('現在地を取得できませんでした。「地図で選ぶ」をお使いください'),
     { enableHighAccuracy:true, timeout:15000 });
};
$('setReset').onclick = async () => {
  const c = counts();
  if (!c.total) { toast('ピンがありません'); return; }
  if (!confirm('すべてのピン（' + c.total + '件）を「未訪問」に戻します。\n新しいチラシ配りを始めるときに使ってください。よろしいですか？')) return;
  const list = [...pins.values()].filter((p) => !p.deleted && p.status !== 'todo');
  const now = new Date().toISOString();
  list.forEach((p) => { p.status = 'todo'; p.author = me; p.updated_at = now; pins.set(p.id, p); });
  cacheLocal(); renderPins();
  const { error } = await db.from('flyer_pins').upsert(list.map(forDb));
  if (error) { list.forEach(enqueue); }
  $('setModal').classList.remove('open');
  toast(list.length + '件を未訪問に戻しました');
};

$('nameOk').onclick = () => {
  const v = $('nameInput').value.trim();
  if (!v) { $('nameInput').focus(); return; }
  me = v;
  lsSet(LS.me, me);
  $('nameModal').classList.remove('open');
};
$('nameInput').onkeydown = (e) => { if (e.key === 'Enter') $('nameOk').click(); };

// シートの外側をタップしたら閉じる
map.on('zoomend', updateAreaLabels);

map.on('movestart', () => { if (!pickMode) { const p = collectPinSheet(); if (p) savePin(p); } });

window.addEventListener('online', () => { flushQueue(); loadAll(true); });

/* ============================================================
   起動
   ============================================================ */
(function init() {
  // 追加モードのステータス選択
  $('addStatus').innerHTML = STATUS_KEYS
    .map((k) => '<option value="' + k + '"' + (k === 'done' ? ' selected' : '') + '>' + STATUS[k].label + '</option>').join('');
  // 一覧の絞り込み
  $('listFilter').innerHTML = '<option value="all">すべて表示</option>'
    + STATUS_KEYS.map((k) => '<option value="' + k + '">' + STATUS[k].label + 'だけ</option>').join('')
    + AREA_NAMES.map((n) => '<option value="area:' + esc(n) + '">' + esc(n) + 'だけ</option>').join('');

  // 前回の状態をすぐ出す（通信を待たない）
  const cache = lsGet(LS.cache, null);
  if (cache) {
    (cache.pins || []).forEach((p) => pins.set(p.id, p));
    if (cache.settings) settings = Object.assign(settings, cache.settings);
  }
  queue.forEach((q) => pins.set(q.id, q));
  applyArea(true);
  renderPins();
  setSync(queue.length ? 'warn' : 'ok', queue.length ? ('未送信 ' + queue.length + '件') : '接続中');

  if (!me) $('nameModal').classList.add('open');

  loadAll(false);
  subscribeRealtime();
  startWatch();

  // 念のため定期的に取り直す（リアルタイムが届かないときの保険）
  setInterval(() => { flushQueue(); loadAll(true); }, 12000);
})();
</script>
</body>
