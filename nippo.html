<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f2933">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日報">
<title>日報</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#1f2933;--muted:#7b8794;--border:#e4e7eb;--accent:#3b82f6;--ok:#06c755}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Hiragino Sans","Segoe UI","Meiryo",sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;padding-bottom:110px}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  header{position:sticky;top:0;z-index:5;background:#1f2933;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
  header h1{font-size:19px;flex:1}
  header button{color:#fff;background:rgba(255,255,255,.15);padding:8px 13px;border-radius:10px;font-size:15px}
  main{max-width:820px;margin:0 auto;padding:14px}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  h2{font-size:17px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  h2 .sub{font-weight:400;color:var(--muted);font-size:14px}
  h2 .r{margin-left:auto}
  label.t{display:block;font-weight:700;margin-bottom:5px;font-size:15px}
  .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
  input[type=text],input[type=number],input[type=date],input[type=password],textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;font-size:17px}
  textarea{min-height:90px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:15px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .hint{color:var(--muted);font-size:13px;margin-top:5px}
  .big{font-size:22px;font-weight:700}
  .small-btn{padding:7px 12px;border-radius:9px;background:#e5e7eb;font-size:14px}
  /* ---- 会計ごとの記録 ---- */
  .quick{border:2px solid var(--accent)}
  .orders{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
  .ord{flex:0 0 auto;max-width:230px;text-align:left;border:1.5px solid var(--border);border-radius:12px;padding:8px 12px;background:#fff;font-size:14px;line-height:1.4}
  .ord b{font-size:16px}
  .ord.on{border-color:var(--accent);background:#eff6ff;box-shadow:0 0 0 2px var(--accent) inset}
  .ord.none{color:var(--muted)}
  .q-label{font-weight:700;font-size:14px;color:var(--muted);margin:4px 0 6px}
  .n-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .n-row button{min-width:58px;height:52px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-size:19px;font-weight:700}
  .n-row button.on{background:#1f2933;color:#fff;border-color:#1f2933}
  .n-row .tk{padding:0 16px;font-size:16px;margin-left:auto}
  .n-row .tk.on{background:#f59e0b;border-color:#f59e0b}
  .src-btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .src-btns button{height:62px;border-radius:12px;background:var(--accent);color:#fff;font-size:17px;line-height:1.2;font-weight:700}
  .src-btns button.rep{background:#16a34a}
  .src-btns button.oth{background:#64748b}
  .src-btns button:active{transform:scale(.96)}
  .gap{margin-top:8px;padding:8px 12px;border-radius:10px;background:#fef3c7;color:#92400e;font-size:14px}
  /* ---- 記録済みリスト ---- */
  .stat{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
  .src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 14px;font-size:15px}
  .src-grid span.z{color:#b8c0cc}
  .step{display:flex;align-items:center;gap:6px}
  .step b{min-width:34px;text-align:center;font-size:19px}
  .step button{width:40px;height:40px;border-radius:10px;background:#e5e7eb;font-size:20px;font-weight:700}
  .step .nm{min-width:44px;font-size:15px}
  .cust{border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:8px}
  .cust.open{border-color:var(--accent);background:#f8faff}
  .cust .sum{display:flex;align-items:center;gap:8px}
  .cust .sum .tx{flex:1;min-width:0}
  .cust .sum small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cust .ed{margin-top:10px;display:grid;gap:12px}
  .done-btn{padding:11px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700}
  .del-btn{padding:11px;border-radius:10px;background:#fee2e2;color:#b91c1c}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:6}
  .bar button{flex:1;padding:14px;border-radius:12px;font-weight:700;font-size:17px}
  .b1{background:#e5e7eb}.b2{background:var(--accent);color:#fff}.b3{background:var(--ok);color:#fff}
  .page{display:none}
  .h-item{display:flex;align-items:center;gap:8px;padding:12px 2px;border-bottom:1px solid var(--border)}
  .h-item:last-child{border:none}
  .h-item .d{flex:1}.h-item small{color:var(--muted);display:block}
  #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:12px 18px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;display:flex;gap:14px;align-items:center;white-space:nowrap}
  #toast.show{opacity:1;pointer-events:auto}
  #toast button{color:#93c5fd;font-weight:700}
  /* スマホ幅：ボタンを詰めて、来店経緯を1画面に収める */
  @media (max-width:600px){
    main{padding:10px}
    .card{padding:12px}
    header{padding:10px 12px}
    header button{padding:7px 10px;font-size:14px}
    h2{flex-wrap:wrap;row-gap:2px}
    h2 .sub{order:3;flex-basis:100%}
    .n-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
    .n-row button{min-width:0;height:46px;font-size:17px}
    .n-row .tk{grid-column:1/-1;margin-left:0;height:42px}
    .src-btns{grid-template-columns:repeat(3,1fr);gap:6px}
    .src-btns button{height:52px;font-size:15px}
    .bar{gap:6px;padding-left:10px;padding-right:10px}
    .bar button{padding:13px 4px;font-size:15px;white-space:nowrap}
  }
  pre.prev{white-space:pre-wrap;word-break:break-word;font-family:inherit;background:#f9fafb;border-radius:10px;padding:12px;font-size:15px}
</style>
</head>
<body>
<header>
  <h1>📝 日報</h1>
  <button data-go="hist">履歴</button>
  <button data-go="set">設定</button>
  <button id="btnNew">新規</button>
</header>

<main>
<!-- ===== 入力 ===== -->
<div class="page" id="p-form">

  <!-- 会計ごとの記録（いちばん使う所なので一番上） -->
  <div class="card quick">
    <h2>会計が終わったら<span class="sub">人数 → 来店経緯をタップで記録</span>
      <button class="small-btn r" id="btnSq">Square更新</button></h2>
    <div id="sqBox"></div>
    <div class="q-label">人数</div>
    <div class="n-row" id="nRow"></div>
    <div class="q-label">来店経緯（押すと記録されます）</div>
    <div class="src-btns" id="srcBtns"></div>
  </div>

  <div class="card">
    <h2>▼実績</h2>
    <div class="row">
      <div><label class="t">① 本日売上（円）</label><input type="number" inputmode="numeric" id="sales"><div class="hint" id="salesHint"></div></div>
      <div><label class="t">② 累計売上（円）</label><input type="number" inputmode="numeric" id="cum"><div class="hint" id="cumHint"></div></div>
    </div>
    <div class="stat"><span>③ 客数（自動）</span><span class="big" id="guestTotal">0人</span></div>
    <div class="src-grid" id="srcSum"></div>
  </div>

  <div class="card">
    <h2>記録したお客さん<span class="sub">反応を書いた組だけ営業報告に載ります</span>
      <button class="small-btn r" id="addCust">＋手で追加</button></h2>
    <div id="custList"></div>
  </div>

  <div class="card">
    <div class="row">
      <div><label class="t">日付</label><input type="date" id="date"></div>
      <div><label class="t">記入者</label><input type="text" id="who" placeholder="名前"></div>
    </div>
    <label class="t" style="margin-top:12px">天気</label>
    <div class="chips" id="weather"></div>
  </div>

  <div class="card"><h2>申し送り</h2><textarea id="handover" placeholder="キーボードのマイク🎤で話して入力もできます"></textarea></div>

  <div class="card">
    <h2>▼インバウンド</h2>
    <textarea id="inbound" style="min-height:60px"></textarea>
    <div class="row" style="margin-top:10px">
      <div><label class="t">話せた方</label><div class="step" data-num="talked"></div></div>
      <div><label class="t">口コミ依頼できた人数</label><div class="step" data-num="review"></div></div>
    </div>
  </div>

  <div class="card">
    <h2>全体総数（在庫）</h2>
    <div class="row">
      <div><label class="t">鰻ストッカー（尾）</label><input type="number" inputmode="numeric" id="stocker"></div>
      <div><label class="t">残り鰻（尾）</label><input type="number" inputmode="numeric" id="eelLeft"></div>
      <div><label class="t">スタート（尾）</label><input type="number" inputmode="numeric" id="eelStart"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label class="t">米袋（g）</label><input type="number" inputmode="numeric" id="riceBag"></div>
      <div><label class="t">米冷蔵庫（g）</label><input type="number" inputmode="numeric" id="riceFridge"></div>
      <div><label class="t">米冷凍庫（g）</label><input type="number" inputmode="numeric" id="riceFreezer"></div>
    </div>
    <label class="t" style="margin-top:10px">その他報告（焦がし・ロスなど）</label>
    <textarea id="stockNote" style="min-height:60px"></textarea>
  </div>
</div>

<!-- ===== プレビュー ===== -->
<div class="page" id="p-prev"><div class="card"><pre class="prev" id="prevText"></pre></div></div>

<!-- ===== 履歴 ===== -->
<div class="page" id="p-hist"><div class="card"><h2>過去の日報</h2><div id="histList"></div></div>
  <div class="card"><button class="chip" id="btnExport">バックアップを保存</button>
  <div class="hint">日報はこのiPadの中に自動保存されます。</div></div>
</div>

<!-- ===== 設定 ===== -->
<div class="page" id="p-set">
  <div class="card">
    <h2>Square連携</h2>
    <label class="t">合言葉</label>
    <input type="password" id="sqKey" autocomplete="off" placeholder="Vercelに設定した NIPPO_TOKEN と同じ文字">
    <div class="hint">入れると、本日売上と会計ごとの注文がSquareから自動で入ります。</div>
  </div>
  <div class="card">
    <h2>累計売上</h2>
    <div class="chips" id="cumMode"></div>
    <div class="hint">「月ごと」は毎月1日に0から数え直します。</div>
  </div>
</div>
</main>

<div class="bar" id="bar">
  <button class="b1" id="btnPrev">プレビュー</button>
  <button class="b2" id="btnCopy">コピー</button>
  <button class="b3" id="btnShare">LINEで送る</button>
</div>
<div id="toast"></div>

<script>
const API='https://task-app-nine-liard.vercel.app/api/nippo_sales';
const $=id=>document.getElementById(id);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SOURCES=['リピーター','インスタ','看板','グーグル','チラシ','声かけ','通りがかり','紹介','スレッズ','X','インフルエンサー','出前','その他'];
// 日報の「来店経緯」欄に出す項目（声かけ・通りがかりは「その他」に合算）
const REPORT_SOURCES=['リピーター','インスタ','スレッズ','X','看板','グーグル','チラシ','紹介','インフルエンサー','出前','その他'];
const toReportSrc=s=>REPORT_SOURCES.includes(s)?s:'その他';
const MENU=['特上','上','並'];
const WEATHERS=['晴','曇','雨','雪','晴のち雨','雨のち晴'];
const TEXT=['date','who','sales','cum','handover','inbound','stocker','eelLeft','eelStart','riceBag','riceFridge','riceFreezer','stockNote'];
const yen=n=>'¥'+Number(n||0).toLocaleString();
const todayStr=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastTimer;
function toast(m,undo){const t=$('toast');t.innerHTML='';const s=document.createElement('span');s.textContent=m;t.appendChild(s);
  if(undo){const b=document.createElement('button');b.textContent='取り消す';b.onclick=()=>{undo();t.classList.remove('show')};t.appendChild(b)}
  t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),undo?5000:1800)}

let R;              // 編集中の日報
let openId=null;    // 開いているお客さんカード
let cumTouched=false;
let qN=1,qTake=false,qOrder=null; // 会計記録パネルの選択
let SQ=null;        // Squareから取った今日のデータ {total,count,orders,at}
let autoToday=true; // 履歴から過去の日報を開いたときは日付を勝手に変えない

function blank(date){
  const last=latestBefore(date||todayStr());
  return {date:date||todayStr(),who:ls.get('nippo_who',''),weather:'',customers:[],talked:0,review:0,eelStart:last&&last.eelStart||'20'};
}
function allReports(){return ls.get('nippo_all',{})}
function latestBefore(date){const a=allReports();const k=Object.keys(a).filter(x=>x<date).sort().pop();return k?a[k]:null}
function save(){if(!R.date)return;const a=allReports();a[R.date]=R;ls.set('nippo_all',a);ls.set('nippo_who',R.who||'')}

/* ---------- 集計 ---------- */
const guestTotal=()=>R.customers.reduce((s,c)=>s+(+c.n||0),0);
function srcCounts(){const o={};REPORT_SOURCES.forEach(s=>o[s]=0);R.customers.forEach(c=>{if(c.src)o[toReportSrc(c.src)]+=(+c.n||0)});return o}
function prevCum(){
  const p=latestBefore(R.date);if(!p||p.cum===''||p.cum==null)return null;
  if(ls.get('nippo_cummode','month')==='month'&&p.date.slice(0,7)!==R.date.slice(0,7))return 0;
  return +p.cum;
}
function autoCum(){const pc=prevCum();if(pc==null||cumTouched)return;R.cum=String(pc+(+R.sales||0));$('cum').value=R.cum}
// Squareの品名 → 特上/上/並（鰻重だけ数える。それ以外は「他」として表示だけ）
function mapItems(items){
  const ord={},other=[];
  (items||[]).forEach(i=>{const n=i.name||'';
    if(n.includes('重')){const k=n.includes('特')?'特上':n.includes('並')?'並':'上';ord[k]=(ord[k]||0)+i.qty}
    else other.push(n+(i.qty>1?'×'+i.qty:''))});
  return {ord,other:other.join('・')};
}

/* ---------- 会計記録パネル ---------- */
function renderQuick(){
  $('nRow').innerHTML='';
  [1,2,3,4,5,6].forEach(n=>{const b=document.createElement('button');b.textContent=n===6?'6+':n;b.className=qN===n?'on':'';
    b.onclick=()=>{qN=n===6?(+prompt('人数',6)||6):n;renderQuick()};$('nRow').appendChild(b)});
  if(qN>6)$('nRow').children[5].textContent=qN,$('nRow').children[5].className='on';
  const tk=document.createElement('button');tk.className='tk'+(qTake?' on':'');tk.textContent='テイクアウト';
  tk.onclick=()=>{qTake=!qTake;renderQuick()};$('nRow').appendChild(tk);
  $('srcBtns').innerHTML='';
  SOURCES.forEach(s=>{const b=document.createElement('button');b.textContent=s;
    if(s==='リピーター')b.className='rep';if(s==='その他')b.className='oth';
    b.onclick=()=>record(s);$('srcBtns').appendChild(b)});
  renderSqBox();
}
function unassigned(){if(!SQ)return[];const used=new Set(R.customers.map(c=>c.sqId).filter(Boolean));
  return SQ.orders.filter(o=>!used.has(o.id)).slice().reverse()} // 新しい順
function renderSqBox(){
  const box=$('sqBox');box.innerHTML='';
  if(!ls.get('nippo_sqkey','')){box.innerHTML='<div class="hint" style="margin:-4px 0 10px">設定で合言葉を入れると、Squareの会計がここに並びます</div>';return}
  if(!SQ){box.innerHTML='<div class="hint" style="margin:-4px 0 10px">'+(sqErr?'⚠️ Squareを読めませんでした（'+esc(sqErr)+'）。合言葉を確認してください。会計なしでも記録はできます':'Squareを読み込み中…')+'</div>';return}
  const list=unassigned();
  if(qOrder&&!list.some(o=>o.id===qOrder))qOrder=null;
  if(qOrder===null&&list.length)qOrder=list[0].id;
  const wrap=document.createElement('div');wrap.className='orders';
  list.forEach(o=>{const m=mapItems(o.items);const b=document.createElement('button');b.className='ord'+(qOrder===o.id?' on':'');
    const txt=[MENU.filter(k=>m.ord[k]).map(k=>k+'×'+m.ord[k]).join(' '),m.other].filter(Boolean).join('・')||'（明細なし）';
    b.innerHTML=`<b>${esc(o.time)}</b> ${yen(o.total)}<br>${esc(txt)}`;
    b.onclick=()=>{qOrder=o.id;renderSqBox()};wrap.appendChild(b)});
  const nb=document.createElement('button');nb.className='ord none'+(qOrder===''?' on':'');nb.innerHTML='<b>会計なし</b><br>Squareと紐付けない';
  nb.onclick=()=>{qOrder='';renderSqBox()};wrap.appendChild(nb);
  box.appendChild(wrap);
  if(!list.length){const h=document.createElement('div');h.className='hint';h.style.margin='-6px 0 10px';h.textContent=`未記録の会計はありません（Square ${SQ.orders.length}件・${SQ.at}更新）`;box.appendChild(h)}
  else{const h=document.createElement('div');h.className='hint';h.style.margin='-6px 0 10px';h.textContent=`未記録 ${list.length}件（Square ${SQ.orders.length}件・${SQ.at}更新）。選んでいる会計に記録されます`;box.appendChild(h)}
}
function record(src){
  const o=SQ&&qOrder?SQ.orders.find(x=>x.id===qOrder):null;
  const m=o?mapItems(o.items):{ord:{},other:''};
  const c={id:Date.now(),src,n:qN,takeout:qTake,ord:m.ord,other:m.other,label:'',comment:'',
    sqId:o?o.id:null,time:o?o.time:new Date().toTimeString().slice(0,5)};
  R.customers.unshift(c);save();
  qN=1;qTake=false;qOrder=null;
  renderQuick();renderCustomers();renderSales();
  toast(`記録しました：${src} ${c.n}名`,()=>{R.customers=R.customers.filter(x=>x!==c);save();renderQuick();renderCustomers();renderSales()});
}

/* ---------- Square ---------- */
let sqBusy=false,sqErr='';
async function fetchSquare(manual){
  const key=ls.get('nippo_sqkey','');if(!key||sqBusy)return;
  if(R.date!==todayStr()&&!manual)return;
  sqBusy=true;$('btnSq').textContent='読込中…';
  try{
    const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-App-Token':key},body:JSON.stringify({date:R.date})});
    const j=await res.json();
    if(!res.ok||!j.ok)throw new Error(j.error||res.status);
    SQ={total:j.total,count:j.count,orders:j.orders||[],at:new Date().toTimeString().slice(0,5),date:R.date};
    R.sales=String(j.total);$('sales').value=R.sales;autoCum();save();
    sqErr='';if(manual)toast('Squareから更新しました');
  }catch(e){sqErr=e.message||'通信エラー';if(manual)toast('Squareを読めませんでした：'+sqErr)}
  sqBusy=false;$('btnSq').textContent='Square更新';
  renderSqBox();renderSales();
}

/* ---------- 画面描画 ---------- */
function renderAll(){TEXT.forEach(f=>$(f).value=R[f]||'');renderWeather();renderQuick();renderCustomers();renderSteppers();renderSales()}
function renderWeather(){
  $('weather').innerHTML='';
  WEATHERS.forEach(w=>{const b=document.createElement('button');b.className='chip'+(R.weather===w?' on':'');b.textContent=w;
    b.onclick=()=>{R.weather=R.weather===w?'':w;renderWeather();save()};$('weather').appendChild(b)});
}
function stepper(el,get,set,min=0){
  el.innerHTML='';
  const m=document.createElement('button');m.textContent='−';
  const v=document.createElement('b');v.textContent=get();
  const p=document.createElement('button');p.textContent='＋';
  m.onclick=()=>{set(Math.max(min,get()-1));v.textContent=get()};
  p.onclick=()=>{set(get()+1);v.textContent=get()};
  el.append(m,v,p);
}
function renderSteppers(){document.querySelectorAll('[data-num]').forEach(el=>{const k=el.dataset.num;stepper(el,()=>+R[k]||0,v=>{R[k]=v;save()})})}
function custTitle(c){
  const type=c.src==='リピーター'?'リピーター':'新規';
  const parts=[];
  if(c.src&&c.src!=='リピーター')parts.push(c.src+(['声かけ','通りがかり','その他'].includes(c.src)?'':'経由'));
  if(+c.n>1)parts.push(c.n+'名');
  if(c.takeout)parts.push('テイクアウト');
  if(c.label)parts.push(c.label);
  return type+'｜'+parts.join('・');
}
const ordText=c=>[MENU.filter(m=>+(c.ord||{})[m]).map(m=>m+'×'+c.ord[m]).join(' '),c.other].filter(Boolean).join('・');
function renderCustomers(){
  const box=$('custList');box.innerHTML='';
  if(!R.customers.length)box.innerHTML='<div class="hint">まだ記録がありません</div>';
  R.customers.forEach(c=>{
    const d=document.createElement('div');d.className='cust'+(openId===c.id?' open':'');
    d.innerHTML=`<div class="sum"><div class="tx"><b>${esc(c.time||'')} ${esc(custTitle(c))}</b><small>${esc(ordText(c)||'注文なし')}${c.comment?'　💬'+esc(c.comment):''}</small></div></div>`;
    if(openId!==c.id){const b=document.createElement('button');b.className='small-btn';b.textContent=c.comment?'編集':'反応を書く';
      b.onclick=()=>{openId=c.id;renderCustomers()};d.querySelector('.sum').appendChild(b)}
    else d.appendChild(editor(c));
    box.appendChild(d);
  });
  renderCounts();
}
function renderCounts(){
  $('guestTotal').textContent=guestTotal()+'人';const sc=srcCounts();
  $('srcSum').innerHTML=REPORT_SOURCES.map(s=>`<span class="${sc[s]?'':'z'}">${s}：${sc[s]}人</span>`).join('');
}
function editor(c){
  const e=document.createElement('div');e.className='ed';
  const k=document.createElement('div');k.innerHTML='<label class="t">お客様の反応（マイク🎤で話して入力できます）</label>';
  const ki=document.createElement('textarea');ki.style.minHeight='80px';ki.value=c.comment||'';
  ki.oninput=()=>{c.comment=ki.value;save()};k.appendChild(ki);e.appendChild(k);
  const l=document.createElement('div');l.innerHTML='<label class="t">見出しに足す一言（任意）</label>';
  const li=document.createElement('input');li.type='text';li.placeholder='例：名古屋からの出張の方々';li.value=c.label||'';
  li.oninput=()=>{c.label=li.value;save()};l.appendChild(li);e.appendChild(l);
  const s=document.createElement('div');s.innerHTML='<label class="t">来店経緯</label>';
  const sc=document.createElement('div');sc.className='chips';
  SOURCES.forEach(x=>{const b=document.createElement('button');b.className='chip'+(c.src===x?' on':'');b.textContent=x;
    b.onclick=()=>{c.src=x;save();sc.querySelectorAll('.chip').forEach(y=>y.classList.toggle('on',y===b));renderCounts()};sc.appendChild(b)});
  s.appendChild(sc);e.appendChild(s);
  const r=document.createElement('div');r.className='row';
  const n=document.createElement('div');n.innerHTML='<label class="t">人数</label>';
  const ns=document.createElement('div');ns.className='step';n.appendChild(ns);
  stepper(ns,()=>+c.n||1,v=>{c.n=v;save();renderCounts()},1);
  const tk=document.createElement('div');tk.innerHTML='<label class="t">形態</label>';
  const tb=document.createElement('button');tb.className='chip'+(c.takeout?' on':'');tb.textContent='テイクアウト';
  tb.onclick=()=>{c.takeout=!c.takeout;tb.classList.toggle('on',c.takeout);save()};tk.appendChild(tb);
  r.append(n,tk);e.appendChild(r);
  const o=document.createElement('div');o.innerHTML='<label class="t">注文</label>';
  const or=document.createElement('div');or.className='row';c.ord=c.ord||{};
  MENU.forEach(m=>{const w=document.createElement('div');w.className='step';
    const nm=document.createElement('span');nm.className='nm';nm.textContent=m;w.appendChild(nm);
    const st=document.createElement('div');st.className='step';w.appendChild(st);
    stepper(st,()=>+c.ord[m]||0,v=>{c.ord[m]=v;save()});or.appendChild(w)});
  o.appendChild(or);e.appendChild(o);
  const btns=document.createElement('div');btns.className='row';
  const del=document.createElement('button');del.className='del-btn';del.textContent='削除';
  del.onclick=()=>{if(confirm('この記録を削除しますか？')){R.customers=R.customers.filter(x=>x!==c);openId=null;save();renderCustomers();renderSqBox();renderSales()}};
  const ok=document.createElement('button');ok.className='done-btn';ok.textContent='完了';
  ok.onclick=()=>{openId=null;renderCustomers()};
  btns.append(del,ok);e.appendChild(btns);
  return e;
}
function renderSales(){
  const h=$('salesHint');
  if(SQ&&SQ.date===R.date){
    const left=unassigned().length;
    h.textContent=`Squareから自動（${SQ.at}更新・会計${SQ.count}件）`;
    h.innerHTML=esc(h.textContent)+(left?`<div class="gap">来店経緯が未記録の会計が ${left}件 あります</div>`:'');
  }else h.textContent=ls.get('nippo_sqkey','')?'':'設定で合言葉を入れるとSquareから自動で入ります';
  const pc=prevCum();
  $('cumHint').textContent=pc==null?'前回の日報がないので、今回だけ手入力してください（次回から自動）'
    :`前回の累計 ${yen(pc)} ＋ 本日売上 で自動計算`+(cumTouched?'（手入力中）':'');
}

/* ---------- 日報の文章 ---------- */
function reportText(){
  const SEP='＝＝＝＝＝＝＝＝＝＝＝＝＝';
  const d=new Date(R.date+'T00:00');const wd='日月火水木金土'[d.getDay()];
  const L=['【日報】',`日付：${d.getMonth()+1}月${d.getDate()}日（${wd}）`,`天気：${R.weather||''}`,`記入者：${R.who||''}`,SEP,
    '▼実績',`① 本日売上：${yen(R.sales)}`,`② 累計売上：${yen(R.cum)}`,`③ 客数：${guestTotal()}人`,SEP,'▼来店経緯'];
  const sc=srcCounts();REPORT_SOURCES.forEach(s=>L.push(`${s}：${sc[s]}人`));
  L.push(SEP,'▼営業報告（お客様の反応）');
  R.customers.slice().reverse().filter(c=>(c.comment||'').trim()||c.label).forEach(c=>{
    const o=MENU.filter(m=>+(c.ord||{})[m]).map(m=>m+'×'+c.ord[m]).join(' ');
    L.push('',custTitle(c),((c.comment||'').trim()+(o?`（${o}）`:'')).trim())});
  if((R.handover||'').trim())L.push('','申し送り',R.handover.trim());
  L.push('','▼インバウンド');if((R.inbound||'').trim())L.push(R.inbound.trim());
  L.push('',`話せた方：${+R.talked||0}人`,`口コミ依頼できた人数：${+R.review||0}人`);
  L.push(SEP,'全体総数',`鰻ストッカー：${R.stocker||0}尾`,'',
    `残り鰻：${R.eelLeft||0}尾（スタート：${R.eelStart||0}尾）`,
    `米袋：約${Number(R.riceBag||0).toLocaleString()}g`,`米冷蔵庫：約${Number(R.riceFridge||0).toLocaleString()}g`,
    `米冷凍庫：${Number(R.riceFreezer||0).toLocaleString()}g`);
  if((R.stockNote||'').trim())L.push('',R.stockNote.trim());
  return L.join('\n');
}

/* ---------- 画面切替 ---------- */
let page='form';
function go(p){
  page=p;['form','prev','hist','set'].forEach(x=>$('p-'+x).style.display=x===p?'block':'none');
  $('bar').style.display=(p==='form'||p==='prev')?'flex':'none';
  $('btnPrev').textContent=p==='prev'?'入力に戻る':'プレビュー';
  document.querySelectorAll('[data-go]').forEach(b=>b.textContent=b.dataset.go===p?'戻る':(b.dataset.go==='hist'?'履歴':'設定'));
  if(p==='prev')$('prevText').textContent=reportText();
  if(p==='hist')renderHist();
  if(p==='set')renderSettings();
  if(p==='form'){renderQuick();fetchSquare(false)}
  scrollTo(0,0);
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(page===b.dataset.go?'form':b.dataset.go));
$('btnPrev').onclick=()=>go(page==='prev'?'form':'prev');

function renderHist(){
  const a=allReports();const keys=Object.keys(a).sort().reverse();
  $('histList').innerHTML=keys.length?'':'<div class="hint">まだ保存された日報はありません</div>';
  keys.forEach(k=>{const o=a[k];const r=document.createElement('div');r.className='h-item';
    const n=(o.customers||[]).reduce((s,c)=>s+(+c.n||0),0);
    r.innerHTML=`<div class="d"><b>${k.replace(/-/g,'/')}</b> ${esc(o.weather||'')}<small>売上 ${yen(o.sales)}・${n}人・${esc(o.who||'')}</small></div>`;
    const b=document.createElement('button');b.className='small-btn';b.textContent='開く';b.onclick=()=>{autoToday=false;SQ=null;load(o);go('form')};
    r.appendChild(b);$('histList').appendChild(r)});
}
function renderSettings(){
  $('sqKey').value=ls.get('nippo_sqkey','');
  const mode=ls.get('nippo_cummode','month');$('cumMode').innerHTML='';
  [['month','月ごと'],['all','ずっと足し続ける']].forEach(([v,t])=>{const b=document.createElement('button');b.className='chip'+(mode===v?' on':'');b.textContent=t;
    b.onclick=()=>{ls.set('nippo_cummode',v);renderSettings()};$('cumMode').appendChild(b)});
}
$('sqKey').oninput=()=>{ls.set('nippo_sqkey',$('sqKey').value.trim());SQ=null;sqErr=''};

/* ---------- 入力イベント ---------- */
TEXT.forEach(f=>$(f).addEventListener('input',()=>{
  R[f]=$(f).value;
  if(f==='cum')cumTouched=true;
  if(f==='sales')autoCum();
  if(f==='who')ls.set('nippo_who',R.who);
  save();if(f==='sales'||f==='cum')renderSales();
}));
$('date').addEventListener('change',()=>{
  const o=allReports()[$('date').value];SQ=null;autoToday=$('date').value===todayStr();
  if(o)load(o);else{const who=R.who;load(Object.assign(blank($('date').value),{who}))}
  fetchSquare(true);
});
$('addCust').onclick=()=>{
  const c={id:Date.now(),src:'',n:1,takeout:false,ord:{},label:'',comment:'',time:new Date().toTimeString().slice(0,5)};
  R.customers.unshift(c);openId=c.id;save();renderCustomers();
};
$('btnSq').onclick=()=>fetchSquare(true);
$('btnNew').onclick=()=>{
  if(!confirm('今日の日報を開きますか？（今の内容は保存済みです）'))return;
  SQ=null;autoToday=true;load(allReports()[todayStr()]||blank());go('form');
};
async function copy(t){
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  toast('コピーしました。LINEに貼り付けてください');
}
function check(){
  const left=SQ&&SQ.date===R.date?unassigned().length:0;
  if(left&&!confirm(`来店経緯が未記録の会計が${left}件あります。このまま進めますか？`))return false;
  const miss=R.customers.filter(c=>!c.src).length;
  if(miss&&!confirm(`来店経緯が未選択の記録が${miss}件あります。このまま進めますか？`))return false;
  return true;
}
$('btnCopy').onclick=()=>{if(check())copy(reportText())};
$('btnShare').onclick=async()=>{
  if(!check())return;const t=reportText();
  if(navigator.share){try{await navigator.share({text:t})}catch(e){}}
  else location.href='https://line.me/R/share?text='+encodeURIComponent(t);
};
$('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(allReports(),null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nippo-backup.json';a.click()};

function load(o){R=JSON.parse(JSON.stringify(o));R.customers=R.customers||[];openId=null;cumTouched=false;
  const pc=prevCum();if(R.cum!==''&&R.cum!=null&&pc!=null&&+R.cum!==pc+(+R.sales||0))cumTouched=true;
  renderAll();save()}

// アプリを開き直したとき・1分ごとにSquareを読み直す（会計直後に開けば最新の会計が出る）
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&page==='form'){
  if(autoToday&&R.date<todayStr()){/* 開きっぱなしで日をまたいだら今日の日報へ */SQ=null;load(allReports()[todayStr()]||blank())}
  fetchSquare(false)}});
setInterval(()=>{if(!document.hidden&&page==='form')fetchSquare(false)},60000);

load(allReports()[todayStr()]||blank());
go('form');
</script>
</body>
